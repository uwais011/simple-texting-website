<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Chat - Debug Version</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <h1>💬 Simple Chat</h1>
            <p class="subtitle">Real-time messaging • Secure rooms</p>
        </div>

        <!-- Login/Join Section -->
        <div class="chat-setup" id="setupSection">
            <div class="setup-card">
                <h2>Join a Chat Room</h2>
                <input 
                    type="text" 
                    id="usernameInput" 
                    placeholder="Enter your name" 
                    class="input-field"
                />
                <input 
                    type="text" 
                    id="roomInput" 
                    placeholder="Enter room name" 
                    class="input-field"
                />
                <input 
                    type="password" 
                    id="passwordInput" 
                    placeholder="Enter room password" 
                    class="input-field"
                />
                <button onclick="joinChat()" class="btn-join">Enter Chat</button>
                <p class="info-text">💡 Share the room name & password with others to chat together!</p>
            </div>
        </div>

        <!-- Chat Window -->
        <div class="chat-window" id="chatWindow" style="display: none;">
            <div class="room-info">
                <div>
                    <span>Room: <strong id="roomName"></strong></span>
                    <span style="margin-left: 20px;">User: <strong id="userName"></strong></span>
                </div>
                <button onclick="leaveChat()" class="btn-leave">Leave Chat</button>
            </div>
            
            <div class="messages" id="messages"></div>
            
            <div class="input-area">
                <input 
                    type="text" 
                    id="messageInput" 
                    placeholder="Type your message..." 
                    class="message-input"
                    onkeypress="handleKeyPress(event)"
                />
                <button onclick="sendMessage()" class="btn-send">Send</button>
            </div>
        </div>
    </div>

    <script>
        // Global room storage
        const allRooms = {};
        let currentUser = '';
        let currentRoom = '';
        let currentPassword = '';
        let pollInterval = null;

        function joinChat() {
            const username = document.getElementById('usernameInput').value;
            const room = document.getElementById('roomInput').value;
            const password = document.getElementById('passwordInput').value;

            if (!username || !room || !password) {
                alert('Please fill in all fields');
                return;
            }

            currentUser = username;
            currentRoom = room;
            currentPassword = password;

            const roomId = room + '|' + password;
            if (!allRooms[roomId]) {
                allRooms[roomId] = [];
            }

            document.getElementById('setupSection').style.display = 'none';
            document.getElementById('chatWindow').style.display = 'flex';
            document.getElementById('roomName').textContent = room;
            document.getElementById('userName').textContent = username;
            document.getElementById('messages').innerHTML = '';

            refreshMessages();
            startPolling();
            document.getElementById('messageInput').focus();
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value;

            if (!text) return;

            const roomId = currentRoom + '|' + currentPassword;
            
            const msg = {
                id: Date.now(),
                user: currentUser,
                text: text,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
            };

            allRooms[roomId].push(msg);
            input.value = '';

            refreshMessages();
            scrollToBottom();
        }

        function refreshMessages() {
            const roomId = currentRoom + '|' + currentPassword;
            const messages = allRooms[roomId] || [];
            const container = document.getElementById('messages');
            container.innerHTML = '';

            messages.forEach(msg => {
                const div = document.createElement('div');
                div.className = msg.user === currentUser ? 'message own' : 'message other';
                div.innerHTML = `
                    <div class="message-author">${msg.user}</div>
                    <div class="message-bubble">${msg.text}</div>
                    <div class="message-time">${msg.time}</div>
                `;
                container.appendChild(div);
            });

            scrollToBottom();
        }

        function scrollToBottom() {
            const container = document.getElementById('messages');
            container.scrollTop = container.scrollHeight;
        }

        function leaveChat() {
            stopPolling();
            document.getElementById('setupSection').style.display = 'flex';
            document.getElementById('chatWindow').style.display = 'none';
            document.getElementById('usernameInput').value = '';
            document.getElementById('roomInput').value = '';
            document.getElementById('passwordInput').value = '';
            currentUser = '';
            currentRoom = '';
            currentPassword = '';
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                sendMessage();
            }
        }

        function startPolling() {
            pollInterval = setInterval(refreshMessages, 300);
        }

        function stopPolling() {
            if (pollInterval) clearInterval(pollInterval);
        }
    </script>
</body>
</html>
